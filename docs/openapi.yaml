openapi: 3.0.3
info:
  title: Password Manager API
  description: |
    API de cofre de senhas com criptografia no cliente.

    O servidor armazena apenas **blobs cifrados** (`ciphertext` + `nonce`).
    A senha mestra e a `vaultKey` nunca trafegam em claro nem são persistidas.

    ## Autenticação
    ```
    Authorization: Bearer <token>
    ```

    ## KDF
    No registro o cliente envia `kdfSalt`. No login a API devolve `kdfSalt` e
    `kdfParams` para o app rederivar a chave localmente.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Desenvolvimento local

tags:
  - name: Auth
    description: Registro, login e perfil
  - name: VaultItems
    description: Itens cifrados do cofre

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: Dados inválidos
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    KdfParams:
      type: object
      properties:
        algorithm:
          type: string
          example: argon2id
        iterations:
          type: number
          example: 3
        memory:
          type: number
          example: 65536
        parallelism:
          type: number
          example: 1

    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
        active:
          type: boolean
        kdfSalt:
          type: string
        kdfParams:
          $ref: '#/components/schemas/KdfParams'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserRegister:
      type: object
      required: [name, email, password, kdfSalt]
      properties:
        name:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 3
          description: Senha de autenticação (hash no servidor)
        kdfSalt:
          type: string
          description: Salt gerado no cliente para derivar a vaultKey
        kdfParams:
          $ref: '#/components/schemas/KdfParams'

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserLoginResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            token:
              type: string

    VaultItem:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        ciphertext:
          type: string
          description: Payload AES-GCM cifrado (base64/hex)
        nonce:
          type: string
          description: IV do AES-GCM
        version:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VaultItemCreate:
      type: object
      required: [ciphertext, nonce]
      properties:
        ciphertext:
          type: string
        nonce:
          type: string
        version:
          type: integer
          minimum: 1

    VaultItemUpdate:
      type: object
      properties:
        ciphertext:
          type: string
        nonce:
          type: string
        version:
          type: integer
          minimum: 1

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Cadastrar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: Conta criada
        '400':
          description: Email já cadastrado
        '422':
          description: Dados inválidos

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Retorna token JWT, kdfSalt e kdfParams.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
        '400':
          description: Credenciais inválidas
        '403':
          description: Conta desativada

  /auth/me:
    get:
      tags: [Auth]
      summary: Perfil autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Não autorizado
        '403':
          description: Conta desativada

    patch:
      tags: [Auth]
      summary: Atualizar nome
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: Perfil atualizado
        '401':
          description: Não autorizado
        '403':
          description: Conta desativada
        '422':
          description: Dados inválidos

  /vault-items:
    get:
      tags: [VaultItems]
      summary: Listar itens do cofre
      description: Retorna blobs cifrados do usuário. A busca/descriptografia é no cliente.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de itens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VaultItem'
        '401':
          description: Não autorizado
        '403':
          description: Conta desativada

    post:
      tags: [VaultItems]
      summary: Criar item cifrado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultItemCreate'
      responses:
        '201':
          description: Item criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultItem'
        '401':
          description: Não autorizado
        '422':
          description: Dados inválidos

  /vault-items/{id}:
    patch:
      tags: [VaultItems]
      summary: Atualizar item cifrado
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultItemUpdate'
      responses:
        '200':
          description: Item atualizado
        '401':
          description: Não autorizado
        '403':
          description: Sem permissão
        '404':
          description: Item não encontrado

    delete:
      tags: [VaultItems]
      summary: Excluir item
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Excluído
        '401':
          description: Não autorizado
        '403':
          description: Sem permissão
        '404':
          description: Item não encontrado
